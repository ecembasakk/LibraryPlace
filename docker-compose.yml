version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: LibraryPlace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ecem274.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ecembasakk/libraryplace-backend:latest
    ports:
      - "80:8080"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/LibraryPlace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Ecem274.


volumes:
  postgres_data: