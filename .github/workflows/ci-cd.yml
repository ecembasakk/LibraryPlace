name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (Task 2)
        run: cd backend && mvn clean package -DskipTests

      - name: Login DockerHub (Task 4)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image (Task 3-4)
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/libraryplace-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/libraryplace-backend:latest

      - name: Transfer Files to EC2 via SFTP (Task 5)
        run: |
            echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key.pem
            chmod 600 /tmp/ec2_key.pem
            sftp -i /tmp/ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} <<EOF
            put deploy.sh /home/ubuntu/deploy.sh
            put docker-compose.yml /home/ubuntu/docker-compose.yml
            EOF
            rm /tmp/ec2_key.pem

      - name: Run Deploy Script on EC2 via SSH (Task 5)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x /home/ubuntu/deploy.sh
            /home/ubuntu/deploy.sh