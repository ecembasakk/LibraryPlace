name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (Task 2)
        run: cd backend && mvn clean package -DskipTests

      - name: Login DockerHub (Task 4)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image (Task 3-4)
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/libraryplace-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/libraryplace-backend:latest

      - name: Transfer Files to EC2 via SFTP (Task 5)
        uses: wangyucode/sftp-upload-action@v2.0.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          privateKey: ${{ secrets.EC2_SSH_KEY }}
          localDir: "./"
          remoteDir: "/home/ubuntu/"
          include: "deploy.sh,docker-compose.yml"

      - name: Run Deploy Script on EC2 via SSH (Task 5)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x /home/ubuntu/deploy.sh
            /home/ubuntu/deploy.sh